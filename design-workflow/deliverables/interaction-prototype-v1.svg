<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <rect width="1440" height="920" fill="#eef1f5"/>
  <style>
    .phone{fill:#fff;stroke:#25334a;stroke-width:4}.bar{fill:#25334a}.line{stroke:#9aa6b2;stroke-width:2}.dash{stroke:#9aa6b2;stroke-width:2;stroke-dasharray:7 6;fill:none}.card{fill:#f7f8fa;stroke:#c2cad3;stroke-width:2}.cta{fill:#25334a}.accent{fill:#dcecff;stroke:#5684b8;stroke-width:2}.warn{fill:#fff0d8;stroke:#d6973f;stroke-width:2}.text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#25334a}.title{font-size:28px;font-weight:700}.sub{font-size:18px}.small{font-size:15px}.tiny{font-size:13px}.white{fill:#fff}.center{text-anchor:middle}.arrow{stroke:#5684b8;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5684b8"/></marker></defs>
  <text x="720" y="52" class="text title center">《失落星球：寻找能量晶》交互原型 V1</text>
  <text x="720" y="82" class="text sub center">交互设计师输出｜低保真结构稿｜核心操作与状态</text>

  <!-- phone 1 -->
  <rect x="55" y="125" width="365" height="700" rx="34" class="phone"/>
  <rect x="55" y="125" width="365" height="62" rx="30" class="bar"/>
