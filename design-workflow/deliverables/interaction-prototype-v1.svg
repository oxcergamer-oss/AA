  <rect x="82" y="210" width="311" height="250" rx="24" class="accent"/>
  <circle cx="237" cy="328" r="84" fill="#fff" stroke="#5684b8" stroke-width="3"/>
  <path d="M184 342 Q237 276 290 342" class="dash"/><circle cx="204" cy="320" r="7" fill="#5684b8"/><circle cx="270" cy="320" r="7" fill="#5684b8"/>
  <text x="237" y="410" class="text sub center">星球修复进度 3 / 8</text>
  <rect x="110" y="425" width="254" height="10" rx="5" fill="#fff"/><rect x="110" y="425" width="96" height="10" rx="5" fill="#5684b8"/>
  <rect x="82" y="480" width="311" height="78" rx="18" class="card"/>
  <text x="104" y="512" class="text sub">下一阶段奖励</text><text x="104" y="540" class="text small">还需点亮 2 个星域</text><text x="365" y="524" class="text small center">能量晶 ×3</text>
  <rect x="100" y="580" width="275" height="62" rx="31" class="cta"/><text x="237" y="619" class="white sub center">开始探索</text>
  <rect x="82" y="668" width="96" height="74" rx="16" class="card"/><rect x="185" y="668" width="96" height="74" rx="16" class="card"/><rect x="288" y="668" width="105" height="74" rx="16" class="card"/>
  <text x="130" y="700" class="text small center">每日任务</text><text x="233" y="700" class="text small center">邀请协作者</text><text x="340" y="700" class="text small center">收集奖励</text><text x="130" y="725" class="text tiny center">打开浮层</text><text x="233" y="725" class="text tiny center">进入二级页</text><text x="340" y="725" class="text tiny center">奖励弹窗</text>
  <text x="237" y="865" class="text title center">① 活动首页</text>

  <!-- phone 2 -->
  <rect x="537" y="125" width="365" height="700" rx="34" class="phone"/>
  <rect x="537" y="125" width="365" height="62" rx="30" class="bar"/>
  <text x="562" y="164" class="white sub">‹</text><text x="720" y="164" class="white sub center">星际协作站</text><text x="872" y="164" class="white sub">?</text>
  <rect x="564" y="210" width="311" height="168" rx="24" class="accent"/>
  <text x="720" y="247" class="text sub center">星核启动进度</text><text x="720" y="300" class="text title center">2 / 4 位协作者</text>
  <circle cx="632" cy="340" r="15" fill="#5684b8"/><circle cx="680" cy="340" r="15" fill="#5684b8"/><circle cx="760" cy="340" r="15" fill="#fff" stroke="#5684b8" stroke-width="2"/><circle cx="808" cy="340" r="15" fill="#fff" stroke="#5684b8" stroke-width="2"/>
  <rect x="564" y="400" width="311" height="102" rx="18" class="warn"/><text x="588" y="432" class="text sub">邀请收益</text><text x="588" y="464" class="text small">你：能量晶 ×2　协作者：星尘 ×10</text><text x="588" y="488" class="text tiny">好友需完成一次有效协作才会计入进度</text>
  <rect x="590" y="526" width="260" height="58" rx="29" class="cta"/><text x="720" y="562" class="white sub center">召集协作者</text>
  <text x="564" y="622" class="text sub">协作者状态</text>
  <rect x="564" y="640" width="311" height="45" rx="12" class="card"/><text x="584" y="669" class="text small">协作者 A</text><text x="850" y="669" class="text tiny">已助力</text>
  <rect x="564" y="695" width="311" height="45" rx="12" class="card"/><text x="584" y="724" class="text small">协作者 B</text><text x="850" y="724" class="text tiny">待完成</text>
  <text x="720" y="865" class="text title center">② 邀请好友页</text>

  <!-- phone 3 -->
  <rect x="1019" y="125" width="365" height="700" rx="34" class="phone"/>
  <rect x="1019" y="125" width="365" height="700" rx="34" fill="#25334a" opacity=".22"/>
  <rect x="1043" y="190" width="317" height="635" rx="28" fill="#fff" stroke="#25334a" stroke-width="3"/>
  <rect x="1043" y="190" width="317" height="56" rx="28" fill="#f7f8fa"/>
  <rect x="1179" y="207" width="44" height="5" rx="3" fill="#9aa6b2"/>
  <text x="1201" y="282" class="text title center">每日能量任务</text><text x="1201" y="310" class="text small center">今日已完成 2 / 4</text>
  <rect x="1070" y="332" width="263" height="42" rx="14" class="accent"/><text x="1090" y="359" class="text small">当前能量 86</text><text x="1312" y="359" class="text tiny" text-anchor="end">每日 24:00 刷新</text>
  <rect x="1070" y="395" width="263" height="76" rx="16" class="card"/><text x="1090" y="422" class="text sub">扫描星球区域</text><text x="1090" y="450" class="text tiny">完成 1 次探索　奖励：能量 +10</text><rect x="1245" y="415" width="70" height="34" rx="17" class="cta"/><text x="1280" y="438" class="white tiny center">立即执行</text>
  <rect x="1070" y="485" width="263" height="76" rx="16" class="card"/><text x="1090" y="512" class="text sub">邀请协作者</text><text x="1090" y="540" class="text tiny">当前 1 / 2　奖励：能量晶 ×1</text><rect x="1245" y="505" width="70" height="34" rx="17" class="cta"/><text x="1280" y="528" class="white tiny center">去邀请</text>
  <rect x="1070" y="575" width="263" height="76" rx="16" class="warn"/><text x="1090" y="602" class="text sub">补充能源</text><text x="1090" y="630" class="text tiny">已完成　奖励待领取</text><rect x="1245" y="595" width="70" height="34" rx="17" class="cta"/><text x="1280" y="618" class="white tiny center">领取</text>
  <rect x="1070" y="675" width="263" height="65" rx="16" class="card"/><text x="1201" y="712" class="text small center">任务规则 / 每日刷新说明</text>
  <text x="1201" y="865" class="text title center">③ 任务中心浮层</text>

  <!-- annotations -->
  <path d="M420 500 C465 500 485 500 530 500" class="arrow"/><text x="475" y="480" class="text tiny center">点击邀请</text>
  <path d="M902 630 C950 630 970 630 1010 630" class="arrow"/><text x="956" y="610" class="text tiny center">点击任务</text>
  <text x="720" y="900" class="text tiny center">说明：线框稿用于确认页面结构与交互，不代表最终视觉风格。</text>
</svg>
